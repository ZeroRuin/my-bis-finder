plugins {
    id 'java'
    id 'idea'
}

repositories {
    mavenLocal()

    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }

    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.personalbis.PersonalBisPluginTest'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.personalbis'
version = '0.9.6'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.withType(JavaExec).configureEach {
    enableAssertions = true
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    args '--developer-mode', '--debug'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

tasks.register('mechanicsSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs My BiS Finder passive weapon-mechanics regression checks without launching RuneLite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.MechanicsSelfTest'
    enableAssertions = true
}

tasks.register('gimStorageSelfTest', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.GroupStorageSnapshotSelfTest'
}


tasks.register('itemExclusionSelfTest', JavaExec) {
    group = 'verification'
    description = 'Checks item exclusions, supply alternatives, rune eligibility and generated-bank menu scope.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.ItemExclusionSelfTest'
    enableAssertions = true
}


tasks.register('loadoutStatsSizingSelfTest', JavaExec) {
    group = 'verification'
    description = 'Checks wrapped Loadout stats grow and shrink without clipping.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.LoadoutStatsSizingSelfTest'
    systemProperty 'java.awt.headless', 'true'
    enableAssertions = true
}

tasks.register('slayerTaskSelfTest', JavaExec) {
    group = 'verification'
    description = 'Checks task alternatives, assignment locations and catalogue merging.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.SlayerTaskSelfTest'
    systemProperty 'java.awt.headless', 'true'
    enableAssertions = true
}

tasks.register('slayerLocationCoverage', JavaExec) {
    group = 'verification'
    description = 'Writes the Konar/Krystilia confirmed-target coverage report.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.SlayerLocationCoverage'
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('slayerUnresolvedAudit', JavaExec) {
    group = 'verification'
    description = 'Lists every unresolved Konar/Krystilia task variant and area as JSON.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.SlayerUnresolvedAudit'
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('reviewedSlayerLocationsSelfTest', JavaExec) {
    group = 'verification'
    description = 'Checks every imported Slayer review decision and picker scope.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.ReviewedSlayerLocationsSelfTest'
    systemProperty 'java.awt.headless', 'true'
}
