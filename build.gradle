// Local checks only; no CI automation.
['vardorvisSelfTest': 'VardorvisSelfTest',
 'blowpipeAmmoPlanSelfTest': 'BlowpipeAmmoPlanSelfTest',
 'hpStateTtkSelfTest': 'HpStateTtkSelfTest',
 'defenceFillSelfTest': 'DefenceFillSelfTest',
 'manualDefenceReductionSelfTest': 'ManualDefenceReductionSelfTest'].each { taskName, testClass ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.personalbis.' + testClass
        enableAssertions = true
        systemProperty 'java.awt.headless', 'true'
    }
}

// Local performance/parity check. Deliberately exercise a small heap.
tasks.register('ttkPerformanceSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.personalbis.TtkPerformanceSelfTest'
    maxHeapSize = '64m'
